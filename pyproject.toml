[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "electrical-power-budget"
version = "1.0.0"
description = "Offline AC/DC electrical power budgeting and wiring diagrams"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["power_budget*"]

[tool.setuptools.package-data]
power_budget = ["templates/*.html", "static/*.css"]
