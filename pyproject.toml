[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-parameter-tool"
version = "0.1.0"
description = "Device parameter configuration tool with CLI and Web UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4.0",
]

[project.scripts]
device-parameter-cli = "device_parameter_tool.core.cli:main"
device-parameter-web = "device_parameter_tool.web.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
